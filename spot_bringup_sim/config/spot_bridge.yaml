---
# Gazebo groundtruth
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# Joint states: /spot_driver/joint_states is the hardware topic name
# (consumed by move_group). /spot/joint_states kept for the existing sim
# consumers (RSP, CHAMP state estimation); retire it once those are
# remapped to the hardware name.
- ros_topic_name: "/spot_driver/joint_states"
  gz_topic_name: "/model/spot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

# Odometry: hardware name (/spot_driver/odometry) plus the legacy sim name.
- ros_topic_name: "/spot_driver/odometry"
  gz_topic_name: "/model/spot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

# useful for testing (no hardware equivalent - ground truth)
- ros_topic_name: "/spot/ground_truth_pose"
  gz_topic_name: "/model/spot/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS

# Lidar
- ros_topic_name: "/spot/lidar/scan"
  gz_topic_name: "/model/spot/lidar"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "ignition.msgs.LaserScan"
  direction: GZ_TO_ROS
- ros_topic_name: "/unfiltered_velodyne_points"
  gz_topic_name: "/model/spot/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# IMU (no hardware ROS equivalent; internal to sim state estimation)
- ros_topic_name: "/imu/data"
  gz_topic_name: "/model/spot/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: GZ_TO_ROS

# Hand cameras (spot_image_server topic layout on hardware).
# hand_rgb is an rgbd sensor: its depth_image subtopic emulates hardware's
# depth-registered-in-RGB-frame. NOTE: gz depth images are 32FC1 meters;
# hardware may publish 16UC1 millimeters - check consumers.
- ros_topic_name: "/spot_image_server/rgb/hand_rgb/image"
  gz_topic_name: "/model/spot/hand_rgb/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot_image_server/rgb/hand_rgb/camera_info"
  gz_topic_name: "/model/spot/hand_rgb/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot_image_server/depth/hand_rgb/image"
  gz_topic_name: "/model/spot/hand_rgb/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot_image_server/depth/hand_rgb/camera_info"
  gz_topic_name: "/model/spot/hand_rgb/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot_image_server/depth/hand_tof/image"
  gz_topic_name: "/model/spot/hand_tof/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot_image_server/depth/hand_tof/camera_info"
  gz_topic_name: "/model/spot/hand_tof/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS

