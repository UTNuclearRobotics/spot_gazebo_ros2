# Foot contacts (sim-internal; hardware equivalent is /spot_driver/status/feet)
- ros_topic_name: "/spot/contact/front_left"
  gz_topic_name: "/contact/front_left"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot/contact/front_right"
  gz_topic_name: "/contact/front_right"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot/contact/rear_left"
  gz_topic_name: "/contact/rear_left"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/spot/contact/rear_right"
  gz_topic_name: "/contact/rear_right"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: GZ_TO_ROS

# Controller: /spot/joint_trajectory is intentionally NOT bridged here. It has
# its own dedicated parameter_bridge process (see command_bridge in
# spot.gazebo.launch.py) so 200 Hz joint commands never queue behind
# pointcloud/image serialization in this process — same reason /clock was
# split out (see comment at top of this file).

# RFID — retained so server_rack_rfid.sdf and rfid_calibration.sdf still bridge.
# Harmless when the loaded world has no RfidReader: the topics simply stay idle.
- ros_topic_name: "/rfid/reads"
  gz_topic_name: "/rfid/reads"
  ros_type_name: "std_msgs/msg/String"
  gz_type_name: "ignition.msgs.StringMsg"
  direction: GZ_TO_ROS
- ros_topic_name: "/tf"
  gz_topic_name: "/rfid/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS
- ros_topic_name: "/rfid/set_power"
  gz_topic_name: "/rfid/set_power"
  ros_type_name: "std_msgs/msg/String"
  gz_type_name: "ignition.msgs.StringMsg"
  direction: ROS_TO_GZ