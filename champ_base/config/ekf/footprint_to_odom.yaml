footprint_to_odom_ekf:
  ros__parameters:
    # See base_to_footprint.yaml — lowered from 50 for high-RTF operation.
    frequency: 30.0
    publish_tf: true
    transform_timeout: 0.01
    # Future-date odom TF to bridge inter-cycle gaps at high RTF.
    transform_time_offset: 0.15
    two_d_mode: true
    # diagnostics_agg: true

    #x     , y     , z,
    #roll  , pitch , yaw,
    #vx    , vy    , vz,
    #vroll , vpitch, vyaw,
    #ax    , ay    , az

    odom0: /spot_driver/odometry
    odom0_config: [true,  true, false,
               false, false, true,
               true,  true, false,
               false, false, true,
               false, false, false]

    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false,  true,
                  false, false, false]

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom