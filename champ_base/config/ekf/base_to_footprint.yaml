base_to_footprint_ekf:
  ros__parameters:
    # 50 Hz sim-time needs 50 * RTF wall cycles/sec — unreachable at high RTF
    # and the source of "Failed to meet update rate" spam. 30 Hz is enough for
    # base-to-footprint and keeps up to ~RTF 4.
    frequency: 50.0
    publish_tf: true
    transform_timeout: 0.01
    # Future-date the TF so lookups don't see it as stale during the larger
    # sim-time gaps between EKF cycles at high RTF.
    transform_time_offset: 0.045
    two_d_mode: false
    # diagnostics_agg: true

    #x     , y     , z,
    #roll  , pitch , yaw,
    #vx    , vy    , vz,
    #vroll , vpitch, vyaw,
    #ax    , ay    , az

    pose0: base_to_footprint_pose
    pose0_config: [true,  true,  true,
                  true,  true,  true,
                  false, false, false,
                  false, false, false,
                  false, false, false]

    imu0: imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,   # roll, pitch, yaw from IMU orientation
                  false, false, false,
                  false, false, false,
                  false, false, false]

    odom_frame: base_footprint
    base_link_frame: body          # <-- added
    world_frame: base_footprint