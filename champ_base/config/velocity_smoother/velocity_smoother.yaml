velocity_smoother:
  ros__parameters:
    smoothing_frequency: 100.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:  [0.5,  0.35,  0.4]    # vx, vy, w — carried over from the dead config
    min_velocity:  [-0.5, -0.35, -0.4]
    max_accel:     [1.0,  1.0,   2.0]
    max_decel:     [-1.0, -1.0,  -2.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0